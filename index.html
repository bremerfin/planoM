<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pra você, Mari, com carinho (Xô Planilha)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6EF;
    --paper:#FFFFFF;
    --ink:#2A1B2E;
    --ink-soft:#5B4A5E;
    --rose:#E5527D;
    --rose-deep:#C43C63;
    --gold:#F0A83C;
    --plum:#6B4368;
    --sage:#4F9D75;
    --line: rgba(42,27,46,0.14);
    --shadow: 0 22px 46px -24px rgba(42,27,46,0.4);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    overflow:hidden;
    position:fixed; inset:0; width:100%;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; font-weight:600; margin:0; }
  .italic{ font-style:italic; font-weight:500; }
  p{ line-height:1.6; color:var(--ink-soft); margin:0 0 10px; }
  ::selection{ background:var(--rose); color:#fff; }

  /* ---------- Floating blobs ---------- */
  .blob{
    position:absolute; border-radius:50%; filter:blur(50px); opacity:.35;
    animation:float 12s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-26px) scale(1.08); }
  }

  /* ---------- Deck ---------- */
  #deck{ position:fixed; inset:0; overflow:hidden; }
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:32px 26px;
    transform:translateX(60px); opacity:0; pointer-events:none;
    transition:transform .65s cubic-bezier(.4,0,.2,1), opacity .5s ease;
  }
  .slide.active{ transform:translateX(0); opacity:1; pointer-events:auto; z-index:2; }
  .slide.leftward{ transform:translateX(-60px); }
  .slide-inner{ width:100%; max-width:600px; max-height:100%; overflow-y:auto; padding:4px 2px 12px; }
  .slide-inner::-webkit-scrollbar{ width:0; }

  .eyebrow{ font-size:12.5px; font-weight:700; color:var(--plum); letter-spacing:.01em; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .eyebrow .num{ background:var(--ink); color:#fff; border-radius:100px; padding:2px 10px; font-family:'Fraunces',serif; font-style:italic; }

  .slide.active .reveal-el{ animation:riseIn .6s cubic-bezier(.22,1,.36,1) both; }
  .slide.active .reveal-el:nth-child(1){ animation-delay:.05s; }
  .slide.active .reveal-el:nth-child(2){ animation-delay:.15s; }
  .slide.active .reveal-el:nth-child(3){ animation-delay:.25s; }
  .slide.active .reveal-el:nth-child(4){ animation-delay:.35s; }
  .slide.active .reveal-el:nth-child(5){ animation-delay:.45s; }
  .slide.active .reveal-el:nth-child(6){ animation-delay:.55s; }
  .reveal-el{ opacity:0; }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }

  h1.title{ font-size:clamp(26px,6vw,38px); line-height:1.18; }
  .lede{ font-size:16.5px; max-width:50ch; }

  /* ---------- Envelope (slide 0) ---------- */
  .envelope{ width:min(84vw,360px); text-align:center; }
  .envelope-body{ position:relative; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:50px 26px 30px; box-shadow:var(--shadow); }
  .flap{ position:absolute; top:-1px; left:-1px; right:-1px; height:64%; background:linear-gradient(155deg,#fff,#fdf1e9); border:1px solid var(--line); border-bottom:none; clip-path:polygon(0 0,100% 0,50% 78%); transform-origin:top; transition:transform 1s cubic-bezier(.62,-0.02,.34,1.28); border-radius:8px 8px 0 0; }
  .envelope.open .flap{ transform:rotateX(178deg); }
  .seal{ position:absolute; top:37%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px; border-radius:50%; background:var(--rose); color:#fff; font-family:'Fraunces',serif; font-style:italic; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 6px 14px -4px rgba(196,60,99,.6); z-index:2; transition:opacity .4s ease; }
  .envelope.open .seal{ opacity:0; }
  .envelope-to{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .envelope-to b{ color:var(--ink); }
  .open-btn{ margin-top:20px; background:var(--ink); color:#fff; border:none; font-family:'Manrope',sans-serif; font-weight:700; font-size:14.5px; padding:12px 26px; border-radius:100px; cursor:pointer; transition:transform .25s ease, background .25s ease; }
  .open-btn:hover{ transform:translateY(-2px); background:var(--rose-deep); }
  .envelope.open .open-btn{ display:none; }

  /* ---------- Stat pop ---------- */
  .stat-pop{ display:flex; align-items:baseline; gap:14px; margin:18px 0; }
  .stat-pop .big{ font-family:'Fraunces',serif; font-size:clamp(48px,13vw,80px); color:var(--rose-deep); font-style:italic; line-height:.9; }
  .stat-pop .sub{ font-size:14px; max-width:20ch; }

  /* ---------- Goals ---------- */
  .goals{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .goal{ display:flex; align-items:center; gap:14px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:15px 18px; }
  .goal .check{ width:28px; height:28px; border-radius:50%; flex:none; border:2px solid var(--rose); position:relative; }
  .goal .check svg{ position:absolute; inset:0; }
  .goal .check path{ stroke:var(--rose); stroke-width:2.6; fill:none; stroke-dasharray:20; stroke-dashoffset:20; transition:stroke-dashoffset .5s ease .5s; }
  .slide.active .goal .check path{ stroke-dashoffset:0; }
  .goal p{ margin:0; color:var(--ink); font-weight:600; font-size:15px; }

  /* ---------- Donut ---------- */
  .donut-wrap{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; margin-top:14px; }
  .donut{ width:160px; height:160px; border-radius:50%; position:relative; flex:none; transition:background 1s ease; }
  .donut .hole{ position:absolute; inset:22px; background:var(--cream); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .donut .hole strong{ font-family:'Fraunces',serif; font-size:19px; font-style:italic; }
  .donut .hole span{ font-size:10.5px; color:var(--ink-soft); }
  .legend{ display:flex; flex-direction:column; gap:8px; font-size:13.5px; }
  .legend .row{ display:flex; align-items:center; gap:8px; }
  .dot-sw{ width:10px; height:10px; border-radius:3px; flex:none; }
  .legend .val{ font-weight:700; margin-left:auto; padding-left:12px; }
  .toggle-row{ margin-top:18px; display:flex; gap:8px; }
  .toggle-btn{ border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); font-family:'Manrope',sans-serif; font-weight:700; font-size:12.5px; padding:8px 16px; border-radius:100px; cursor:pointer; transition:.2s ease; }
  .toggle-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .donut-caption{ margin-top:12px; font-size:13.5px; }

  /* ---------- Budget ---------- */
  .budget{ margin-top:10px; border-top:1px solid var(--line); }
  .budget-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
  .budget-row .cat{ font-weight:700; font-size:14px; }
  .budget-row .amt{ font-weight:700; color:var(--rose-deep); font-family:'Fraunces',serif; font-size:15px; }
  .budget-note{ max-height:0; overflow:hidden; font-size:13px; color:var(--ink-soft); transition:max-height .35s ease; }
  .budget-row.open + .budget-note{ max-height:60px; padding-bottom:10px; }
  .budget-total{ display:flex; justify-content:space-between; padding:14px 2px 0; font-family:'Fraunces',serif; font-size:18px; }

  /* ---------- Stamp / achievement ---------- */
  .achieve-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:var(--shadow); }
  .stamp{ display:inline-block; border:3px solid var(--sage); color:var(--sage); font-family:'Fraunces',serif; font-style:italic; font-weight:700; padding:6px 16px; border-radius:8px; transform:rotate(-6deg) scale(.6); opacity:0; transition:transform .55s cubic-bezier(.36,1.6,.6,1) .4s, opacity .3s ease .4s; font-size:15px; margin-top:12px; }
  .slide.active .stamp{ transform:rotate(-6deg) scale(1); opacity:1; }
  .bar-track{ height:12px; background:var(--cream); border-radius:100px; margin:14px 0 8px; overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ height:100%; width:0%; border-radius:100px; background:linear-gradient(90deg,var(--gold),var(--rose)); transition:width 1.1s cubic-bezier(.4,0,.2,1) .3s; }
  .slide.active .bar-fill{ width:36%; }
  .parcelas-num{ font-family:'Fraunces',serif; font-size:24px; margin-top:6px; }

  /* ---------- Flip ---------- */
  .flip-card{ width:250px; height:150px; perspective:1400px; cursor:pointer; margin:18px auto 0; }
  .flip-inner{ position:relative; width:100%; height:100%; transition:transform .8s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--line); box-shadow:var(--shadow); }
  .flip-front{ background:var(--paper); }
  .flip-back{ background:linear-gradient(160deg,var(--rose),var(--gold)); color:#fff; transform:rotateY(180deg); }
  .flip-face small{ font-size:11.5px; opacity:.85; }
  .flip-face .role{ font-family:'Fraunces',serif; font-size:22px; margin-top:4px; font-style:italic; }
  .flip-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:12px; }
  #confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:60; }

  /* ---------- Meme reveal ---------- */
  .meme-reveal{ max-height:0; overflow:hidden; opacity:0; transition:max-height .6s ease, opacity .5s ease .1s; }
  .meme-reveal.show{ max-height:520px; opacity:1; margin-top:18px; }
  .meme-reveal img{ max-width:220px; width:100%; height:auto; border-radius:14px; box-shadow:var(--shadow); border:1px solid var(--line); display:block; margin:0 auto; }

  /* ---------- Signature ---------- */
  .signoff{ margin-top:16px; }
  .signoff .name{ font-family:'Fraunces',serif; font-style:italic; font-size:20px; }
  .signoff .brand{ font-size:12.5px; color:var(--ink-soft); }
  .restart-btn{ margin-top:20px; background:none; border:1px solid var(--line); color:var(--ink-soft); font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; padding:9px 18px; border-radius:100px; cursor:pointer; }
  .restart-btn:hover{ border-color:var(--rose); color:var(--rose-deep); }

  /* ---------- Nav ---------- */
  #nav-bar{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); padding:7px 10px; border-radius:100px; box-shadow:var(--shadow); z-index:40; border:1px solid var(--line); }
  .arrow-btn{ pointer-events:auto; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s ease; color:var(--ink); flex:none; }
  .arrow-btn:hover{ background:var(--ink); color:#fff; }
  .arrow-btn.hidden{ opacity:0; pointer-events:none; }
  #dots{ display:flex; gap:6px; align-items:center; padding:0 2px; }
  #dots .d{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:.25s ease; cursor:pointer; }
  #dots .d.active{ background:var(--rose); width:18px; border-radius:4px; }

  @media (max-width:560px){
    .slide{ padding:22px 20px 96px; }
    .flip-card{ width:210px; height:126px; }
    .meme-reveal img{ max-width:170px; }
    .meme-reveal.show{ max-height:320px; }
  }
</style>
</head>
<body>


<div id="deck"></div>

<div id="nav-bar">
  <button class="arrow-btn" id="prevBtn" aria-label="Anterior">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="dots"></div>
  <button class="arrow-btn" id="nextBtn" aria-label="Próximo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
<canvas id="confetti-canvas"></canvas>

<script>
/* ---------------- Slide content ---------------- */
const total = 10;

const slidesHTML = [
// 0 - envelope
`<div class="envelope" id="envelope">
  <div class="envelope-body">
    <div class="flap"></div>
    <div class="seal">AJ</div>
    <p class="envelope-to">Pra <b>Mari</b>, com carinho</p>
    <button class="open-btn" id="openBtn">Abrir nossa carta</button>
  </div>
</div>`,

// 1 - abertura
`<div class="slide-inner">
  <p class="eyebrow reveal-el"><span class="num">1</span> Xô Planilha · retrospectiva</p>
  <h1 class="title reveal-el">Aiii Mari! Vamos relembrar tudo que a gente passou?</h1>
  <p class="lede reveal-el">Nosso primeiro contato... aaaaa, que alegriaaa! Teve ida e volta, marcou reunião, desmarcou reunião... mas no final? Vem ver nossos resultados! 👀</p>
</div>`,

// 2 - lazer
`<div class="slide-inner">
  <p class="eyebrow reveal-el"><span class="num">2</span> Primeira análise</p>
  <h1 class="title reveal-el">A gente olhou seus dados e percebeu que...</h1>
  <div class="stat-pop reveal-el"><span class="big">tudo</span><span class="sub">ia pra lazer!!! 🎉</span></div>
  <p class="lede reveal-el">Eita mulher festeira! Mas tudo bem, porque afinal dinheiro também é pra isso, né não?!</p>
</div>`,

// 3 - metas
`<div class="slide-inner">
  <p class="eyebrow reveal-el"><span class="num">3</span> Mas aí a gente foi mais fundo</p>
  <h1 class="title reveal-el">Gastar com lazer é bom. Mas realizar sonho é melhor ainda.</h1>
  <p class="lede reveal-el">E os seus grandes objetivos eram bem claros:</p>
  <div class="goals reveal-el">
    <div class="goal"><div class="check"><svg viewBox="0 0 30 30"><path d="M8 15l5 5 9-11"/></svg></div><p>Entender pra onde nosso dinheiro estava indo</p></div>
    <div class="goal"><div class="check"><svg viewBox="0 0 30 30"><path d="M8 15l5 5 9-11"/></svg></div><p>Pagar o Imposto de Renda</p></div>
    <div class="goal"><div class="check"><svg viewBox="0 0 30 30"><path d="M8 15l5 5 9-11"/></svg></div><p>Quitar boa parte do empréstimo do carro</p></div>
  </div>
  <p class="reveal-el" style="margin-top:14px; font-weight:700; color:var(--ink);">E, em apenas 3 meses, a gente fez issooooo!! 🙌</p>
</div>`,

// 4 - donut antes/depois
`<div class="slide-inner">
  <p class="eyebrow reveal-el"><span class="num">4</span> Sem planejamento, pra onde ia?</p>
  <h1 class="title reveal-el" style="font-size:24px;">Pra onde nosso dinheiro foi, nesse tempo sem planejamento?</h1>
  <div class="donut-wrap reveal-el">
    <div class="donut" id="donut" style="background: conic-gradient(var(--plum) 0% 40%, var(--rose) 40% 90%, var(--gold) 90% 100%);">
      <div class="hole"><strong id="donutCenter">antes</strong><span>3 grupos</span></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="toggle-row reveal-el">
    <button class="toggle-btn active" data-state="antes">Antes</button>
    <button class="toggle-btn" data-state="depois">Depois do plano</button>
  </div>
  <p class="donut-caption reveal-el" id="donutCaption">40% essenciais, 50% lazer e 10% gastos não programados, tudo sem intenção, simplesmente acontecendo.</p>
</div>`,

// 5 - plano
`<div class="slide-inner">
  <p class="eyebrow reveal-el"><span class="num">5</span> O plano</p>
  <h1 class="title reveal-el" style="font-size:24px;">Foi pensando nisso que entendemos que dá pra ter tudo, festa, essencial e até imprevisto, contanto que a gente planeje até o que não é programado, entende, kkkk</h1>
  <p class="lede reveal-el">Como ficou nosso plano:</p>
  <div class="budget reveal-el" id="budget"></div>
  <div class="budget-total reveal-el"><span>Total</span><span>R$ 7.510</span></div>
</div>`,

// 6 - IR
`<div class="slide-inner">
  <p class="eyebrow reveal-el"><span class="num">6</span> Mais uma meta atingida</p>
  <h1 class="title reveal-el">Depois disso... MAIS UMA META ATINGIDAAA! 🥹</h1>
  <div class="achieve-card reveal-el">
    <p style="margin:0; font-weight:700; color:var(--ink);">Imposto de Renda</p>
    <p style="margin:4px 0 0; font-size:14px;">Quitado! Então agora é só pensar nisso de novo ano que vem!</p>
    <div class="stamp">quitado ✓</div>
  </div>
</div>`,

// 7 - carro
`<div class="slide-inner">
  <p class="eyebrow reveal-el"><span class="num">7</span> E pra fechar com chave de ouro</p>
  <h1 class="title reveal-el">E pra fechar, o que tirava nosso sono, aquela dívida chatinha, ai credo...</h1>
  <div class="achieve-card reveal-el">
    <p style="margin:0; font-weight:700; color:var(--ink);">Empréstimo do carro</p>
    <p class="parcelas-num"><span id="parcelasCount">9</span> de 25 parcelas quitadas!!!!</p>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <p style="margin:0; font-size:13px;">E olha que faltam só 16 agora! Mdsss, lembra do sentimento de que essa dívida não ia acabar nunca? Pois é, ta acabandooo. Xô, dívidaaaa 👋</p>
  </div>
</div>`,

// 8 - investidora
`<div class="slide-inner" style="text-align:center;">
  <p class="eyebrow reveal-el" style="justify-content:center;"><span class="num">8</span> A virada</p>
  <h1 class="title reveal-el">Acha que só porque batemos todas as metas, acabou?</h1>
  <p class="lede reveal-el" style="margin:0 auto;">Nãooo. Lembra do meu lema? <span class="italic">"Meu trabalho é te fazer aposentar."</span> Clica aí pra ver seu novo título 👇</p>
  <div class="flip-card reveal-el" id="flipCard">
    <div class="flip-inner">
      <div class="flip-face flip-front"><small>ontem você era...</small><div class="role">Mari, cliente</div></div>
      <div class="flip-face flip-back"><small>a partir de agora</small><div class="role">Mari, investidora ✦</div></div>
    </div>

const blobColors = ['var(--rose)','var(--gold)','var(--plum)','var(--sage)'];

const deck = document.getElementById('deck');
slidesHTML.forEach((html, i) => {
  const s = document.createElement('div');
  s.className = 'slide';
  s.dataset.index = i;
  if(i>0){
    for(let b=0;b<3;b++){
      const blob = document.createElement('div');
      blob.className = 'blob';
      const size = 140 + Math.random()*160;
      blob.style.width = size+'px'; blob.style.height = size+'px';
      blob.style.left = (Math.random()*90)+'%';
      blob.style.top = (Math.random()*80)+'%';
      blob.style.background = blobColors[(i+b)%blobColors.length];
      blob.style.animationDuration = (9+Math.random()*6)+'s';
      blob.style.animationDelay = (Math.random()*4)+'s';
      s.appendChild(blob);
    }
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  s.appendChild(wrap.firstElementChild);
  deck.appendChild(s);
});

const dotsEl = document.getElementById('dots');
for(let i=1;i<total;i++){
  const d = document.createElement('div');
  d.className = 'd';
  d.dataset.goto = i;
  dotsEl.appendChild(d);
}

let current = 0;
const slideEls = document.querySelectorAll('.slide');

function render(){
  slideEls.forEach((s,i) => {
    s.classList.remove('active','leftward');
    if(i === current) s.classList.add('active');
    else if(i < current) s.classList.add('leftward');
  });
  document.querySelectorAll('#dots .d').forEach(d => {
    d.classList.toggle('active', Number(d.dataset.goto) === current);
  });
  document.getElementById('prevBtn').classList.toggle('hidden', current <= 1);
  document.getElementById('nextBtn').classList.toggle('hidden', current === 0 || current === total-1);
  document.getElementById('nav-bar').style.display = current === 0 ? 'none' : 'flex';

  if(current === 7){
    const el = document.getElementById('parcelasCount');
    let n = 0; el.textContent = '0';
    const timer = setInterval(() => { n++; el.textContent = n; if(n>=9) clearInterval(timer); }, 90);
  }
}
function goTo(i){
  if(i<0 || i>=total) return;
  current = i;
  render();
}
document.getElementById('prevBtn').addEventListener('click', () => goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(current+1));
dotsEl.addEventListener('click', (e) => { if(e.target.dataset.goto) goTo(Number(e.target.dataset.goto)); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goTo(current+1);
  if(e.key === 'ArrowLeft') goTo(current-1);
});
let touchX = null;
document.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx > 60) goTo(current-1);
  if(dx < -60) goTo(current+1);
  touchX = null;
});

/* envelope */
document.getElementById('openBtn').addEventListener('click', () => {
  document.getElementById('envelope').classList.add('open');
  setTimeout(() => goTo(1), 850);
});
document.getElementById('restartBtn').addEventListener('click', () => goTo(1));

  deck.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const s = states[btn.dataset.state];
  document.getElementById('donut').style.background = s.gradient;
  document.getElementById('donutCenter').textContent = s.center;

});

/* flip + confetti */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); window.addEventListener('resize', resize);
let particles = [];
function burst(x,y){
  const colors = ['#E5527D','#F0A83C','#6B4368','#4F9D75'];
  for(let i=0;i<70;i++){
    particles.push({x,y,vx:(Math.random()-.5)*10,vy:Math.random()*-9-2,g:.35,size:Math.random()*6+4,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,life:100});
  }
}
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(p.life/100,0);
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore();
  });
  particles = particles.filter(p => p.life > 0);
  requestAnimationFrame(loop);
}
loop();
let flipped = false;
deck.addEventListener('click', (e) => {
  const card = e.target.closest('#flipCard');
  if(!card) return;
  card.classList.toggle('flipped');
  const meme = document.getElementById('memeReveal');
  if(meme) meme.classList.toggle('show', card.classList.contains('flipped'));
  if(!flipped){
    const r = card.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2);
    flipped = true;
  }
});
